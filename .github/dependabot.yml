version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      soroban-sdk:
        patterns:
          - "soroban-*"

  - package-ecosystem: npm
    directories:
      - /
      - /frontend
      - /tests/integration
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
